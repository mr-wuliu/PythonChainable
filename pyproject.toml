[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyChainable"
version = "0.1.3"
authors = [
  { name="mrwuliu", email="mr_wuliu@foxmail.com" },
]
description = "A package for creating chainable method calls in Python"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/mr-wuliu/PythonChainable"
Issues = "https://github.com/mr-wuliu/PythonChainable/issues"

[tool.basedpyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "strict"
# Proxy pattern legitimately uses Any
reportAny = "none"
reportExplicitAny = "none"
# Many intentional dunder overrides in proxy classes
reportImplicitOverride = "none"
# Lambda params in proxy forwarding are inherently unknown
reportUnknownLambdaType = "none"
reportUnknownVariableType = "none"
